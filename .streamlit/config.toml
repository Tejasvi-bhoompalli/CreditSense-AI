[server]
headless = true
address = "0.0.0.0"
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
